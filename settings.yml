# DorXNG settings.yml for the "Host Tor Bypass" (see README.md).
# Mount into the upstream searxng/searxng container at /etc/searxng/settings.yml.
# Requires Tor running on the host (SOCKS on 127.0.0.1:9050). Change secret_key!
#
# Layered on top of the container's own defaults (use_default_settings), so it
# keeps working as upstream SearXNG evolves. Engine sets were validated against
# every advanced search operator on 2026-11-01:
#   Tor (default):      brave, duckduckgo web, google cse, gmx, s1search, startpage, swisscows
#   Direct (--no-tor):  brave, duckduckgo web, google cse, s1search, swisscows, yahoo
# All other general/web engines are disabled: they ignore dork operators or are unreachable.

use_default_settings: true
general:
  instance_name: DorXNG
  enable_metrics: false
search:
  ban_time_on_fail: 0
  max_ban_time_on_fail: 0
  suspended_times:
    SearxEngineAccessDenied: 0
    SearxEngineCaptcha: 0
    SearxEngineTooManyRequests: 0
    cf_SearxEngineCaptcha: 0
    cf_SearxEngineAccessDenied: 0
    recaptcha_SearxEngineCaptcha: 0
  formats:
  - html
  - json
server:
  secret_key: change-this-secret-key
  limiter: false
  image_proxy: false
outgoing:
  request_timeout: 60.0
  pool_connections: 1000
  proxies:
    all://:
    - socks5h://127.0.0.1:9050
  using_tor_proxy: true
  networks:
    direct:
      proxies: null
      using_tor_proxy: false
plugins:
  searx.plugins.tor_check.SXNGPlugin:
    active: true
engines:
- name: brave
  engine: brave
  shortcut: br
  disabled: false
  time_range_support: true
  paging: true
  categories:
  - general
  - web
  brave_category: search
  inactive: false
- name: duckduckgo web
  engine: duckduckgo_web
  shortcut: ddgw
  disabled: false
  inactive: false
- name: google cse
  engine: google_cse
  shortcut: goc
  disabled: false
  inactive: false
- name: gmx
  engine: gmx
  shortcut: gmx
  disabled: false
  inactive: false
- name: s1search
  engine: s1search_rampjs
  shortcut: s1
  disabled: false
  inactive: false
- name: startpage
  engine: startpage
  shortcut: sp
  disabled: false
  startpage_categ: web
  categories:
  - general
  - web
  inactive: false
- name: swisscows
  engine: swisscows
  categories: general
  swisscows_category: web
  results_per_page: 20
  shortcut: sw
  disabled: false
  inactive: false
